<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>California Housing — stlite Streamlit App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    #root {
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.73.0/build/stlite.js"></script>
  <script>
    // Динамічне завантаження коду з файлу p1.py без дублювання та зашитого коду
    fetch("p1.py")
      .then(response => {
        if (!response.ok) {
          throw new Error("Не вдалося завантажити p1.py");
        }
        return response.text();
      })
      .then(pyCode => {
        stlite.mount({
          requirements: ["scikit-learn", "pandas", "matplotlib", "seaborn"],
          entrypoint: "p1.py",
          files: {
            "p1.py": pyCode
          }
        }, document.getElementById("root"));
      })
      .catch(err => {
        console.error("Помилка завантаження p1.py:", err);
      });
  </script>
</body>
</html>
