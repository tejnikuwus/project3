<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="linearLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="polyCurve" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid Lines -->
  <path d="M 60 370 L 740 370 M 60 270 L 740 270 M 60 170 L 740 170" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <path d="M 160 80 L 160 380 M 340 80 L 340 380 M 520 80 L 520 380 M 700 80 L 700 380" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Scatter Data Points (Train - blue, Test - orange) -->
  <circle cx="110" cy="345" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="150" cy="320" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="190" cy="305" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="230" cy="275" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="270" cy="290" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="320" cy="235" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="370" cy="220" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="420" cy="180" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="470" cy="195" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="530" cy="155" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="590" cy="130" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="650" cy="120" r="5" fill="#f59e0b" opacity="0.8"/>
  <circle cx="700" cy="105" r="5" fill="#3b82f6" opacity="0.6"/>

  <!-- Linear Regression Line (Degree 1) -->
  <line x1="80" y1="360" x2="720" y2="100" stroke="url(#linearLine)" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
  
  <!-- Polynomial Regression Curve (Degree 3) -->
  <path d="M 80 370 C 220 330, 360 210, 520 160 S 660 125, 720 100" fill="none" stroke="url(#polyCurve)" stroke-width="3.5" stroke-dasharray="6,4" filter="url(#glow)"/>

  <!-- House Icon Overlay -->
  <g transform="translate(640, 260) scale(1.6)">
    <path d="M10 20 L25 5 L40 20 L40 40 L10 40 Z" fill="none" stroke="#00f2fe" stroke-width="2.5"/>
    <rect x="20" y="25" width="10" height="15" fill="none" stroke="#00ff88" stroke-width="2"/>
  </g>

  <!-- Legend Badges -->
  <rect x="70" y="390" width="12" height="12" rx="3" fill="#00f2fe"/>
  <text x="90" y="401" fill="#94a3b8" font-family="sans-serif" font-size="12">Лінійна: ŷ = b₀ + b₁x</text>

  <rect x="250" y="390" width="12" height="12" rx="3" fill="#ec4899"/>
  <text x="270" y="401" fill="#94a3b8" font-family="sans-serif" font-size="12">Поліном: ŷ = b₀ + b₁x + b₂x² + ...</text>

  <!-- Title Text -->
  <text x="70" y="70" fill="#00f2fe" font-family="sans-serif" font-size="26" font-weight="bold">California Housing ML</text>
  <text x="70" y="98" fill="#94a3b8" font-family="sans-serif" font-size="15">Поліноміальна Регресія &amp; Аналіз Перенавчання • stlite Wasm</text>
</svg>
