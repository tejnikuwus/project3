<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad3)"/>

  <!-- Mesh Network Circuit Lines -->
  <g stroke="rgba(0, 242, 254, 0.08)" stroke-width="1.5">
    <path d="M 400 220 L 180 120 M 400 220 L 620 120 M 400 220 L 220 340 M 400 220 L 580 340"/>
  </g>

  <!-- Central Hub: Raspberry Pi 4 Node -->
  <g transform="translate(400, 220)">
    <circle cx="0" cy="0" r="75" fill="#0f172a" stroke="url(#purpleGlow)" stroke-width="3" filter="url(#glow3)"/>
    <circle cx="0" cy="0" r="55" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="0" y="-5" font-family="monospace" font-size="14" font-weight="bold" fill="#00f2fe" text-anchor="middle">Raspberry Pi 4</text>
    <text x="0" y="15" font-family="monospace" font-size="10" fill="#00ff88" text-anchor="middle">GATEWAY HUB</text>
  </g>

  <!-- ESP-NOW Sensor Nodes -->
  <!-- Node 1 (Top Left) -->
  <g transform="translate(180, 120)">
    <circle cx="0" cy="0" r="35" fill="#0b1329" stroke="#00f2fe" stroke-width="2" filter="url(#glow3)"/>
    <text x="0" y="-2" font-family="monospace" font-size="10" font-weight="bold" fill="#00f2fe" text-anchor="middle">ESP-1</text>
    <text x="0" y="12" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Sensor Node</text>
  </g>

  <!-- Node 2 (Top Right) -->
  <g transform="translate(620, 120)">
    <circle cx="0" cy="0" r="35" fill="#0b1329" stroke="#00ff88" stroke-width="2" filter="url(#glow3)"/>
    <text x="0" y="-2" font-family="monospace" font-size="10" font-weight="bold" fill="#00ff88" text-anchor="middle">ESP-2</text>
    <text x="0" y="12" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Power Meter</text>
  </g>

  <!-- Node 3 (Bottom Left) -->
  <g transform="translate(220, 340)">
    <circle cx="0" cy="0" r="35" fill="#0b1329" stroke="#00f2fe" stroke-width="2" filter="url(#glow3)"/>
    <text x="0" y="-2" font-family="monospace" font-size="10" font-weight="bold" fill="#00f2fe" text-anchor="middle">ESP-3</text>
    <text x="0" y="12" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Relay Controller</text>
  </g>

  <!-- Node 4 (Bottom Right) -->
  <g transform="translate(580, 340)">
    <circle cx="0" cy="0" r="35" fill="#0b1329" stroke="#ff9f43" stroke-width="2" filter="url(#glow3)"/>
    <text x="0" y="-2" font-family="monospace" font-size="10" font-weight="bold" fill="#ff9f43" text-anchor="middle">ESP-4</text>
    <text x="0" y="12" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">Security Sensor</text>
  </g>

  <!-- Wireless Signal Waves -->
  <path d="M 330 180 A 100 100 0 0 1 310 240" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4,4" filter="url(#glow3)"/>
  <path d="M 470 180 A 100 100 0 0 0 490 240" fill="none" stroke="#00ff88" stroke-width="2" stroke-dasharray="4,4" filter="url(#glow3)"/>

  <!-- Title Badge Overlay -->
  <rect x="30" y="30" width="340" height="40" rx="20" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1"/>
  <text x="50" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#00f2fe">🏠 ESP-NOW &amp; Raspberry Pi Hub</text>
</svg>
