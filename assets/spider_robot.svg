<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradSpider" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#060911"/>
    </linearGradient>
    <linearGradient id="spiderBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ff5500"/>
    </linearGradient>
    <filter id="spiderGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGradSpider)"/>

  <!-- Tech Perspective Grid Lines -->
  <g stroke="rgba(0, 242, 254, 0.05)" stroke-width="1">
    <path d="M 0 60 H 800 M 0 120 H 800 M 0 180 H 800 M 0 240 H 800 M 0 300 H 800 M 0 360 H 800 M 0 420 H 800"/>
    <path d="M 100 0 V 450 M 200 0 V 450 M 300 0 V 450 M 400 0 V 450 M 500 0 V 450 M 600 0 V 450 M 700 0 V 450"/>
  </g>

  <!-- Ground Shadows under Spider Legs -->
  <ellipse cx="170" cy="380" rx="35" ry="8" fill="rgba(0, 242, 254, 0.15)"/>
  <ellipse cx="270" cy="390" rx="40" ry="10" fill="rgba(0, 242, 254, 0.15)"/>
  <ellipse cx="530" cy="390" rx="40" ry="10" fill="rgba(0, 242, 254, 0.15)"/>
  <ellipse cx="630" cy="380" rx="35" ry="8" fill="rgba(0, 242, 254, 0.15)"/>

  <!-- Quadruped / Hexapod Spider Robot Mech Graphic -->
  <g transform="translate(100, 30)">
    <!-- Rear Left Leg (Leg 4) -->
    <path d="M 170 170 L 100 240 L 70 350" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 170 170 L 100 240 L 70 350" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="240" r="10" fill="#0f172a" stroke="#ff9900" stroke-width="2"/>

    <!-- Rear Right Leg (Leg 3) -->
    <path d="M 430 170 L 500 240 L 530 350" fill="none" stroke="#334155" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 430 170 L 500 240 L 530 350" fill="none" stroke="#00f2fe" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="500" cy="240" r="10" fill="#0f172a" stroke="#ff9900" stroke-width="2"/>

    <!-- Main Chassis / Spider Body Frame -->
    <polygon points="220,130 380,130 440,190 380,250 220,250 160,190" fill="url(#spiderBodyGrad)" stroke="#00f2fe" stroke-width="3" filter="url(#spiderGlow)"/>

    <!-- PCB Shield / ESP32 + PCA9685 Driver Core -->
    <rect x="230" y="150" width="140" height="80" rx="8" fill="#0b1329" stroke="#00ff88" stroke-width="2"/>
    <text x="300" y="180" font-family="monospace" font-size="13" font-weight="bold" fill="#00ff88" text-anchor="middle">ESP32 12-DOF</text>
    <text x="300" y="200" font-family="monospace" font-size="10" fill="#00f2fe" text-anchor="middle">PCA9685 PWM IK Core</text>

    <!-- Status LEDs on Chassis -->
    <circle cx="245" cy="215" r="4" fill="#00ff88" filter="url(#spiderGlow)"/>
    <circle cx="260" cy="215" r="4" fill="#00f2fe" filter="url(#spiderGlow)"/>
    <circle cx="275" cy="215" r="4" fill="#ff9900" filter="url(#spiderGlow)"/>

    <!-- Front Left Leg (Leg 1) -->
    <path d="M 180 200 L 110 270 L 170 360" fill="none" stroke="#475569" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 180 200 L 110 270 L 170 360" fill="none" stroke="#00ff88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#spiderGlow)"/>
    <!-- Coxa & Femur Joints -->
    <circle cx="180" cy="200" r="12" fill="#0f172a" stroke="#00f2fe" stroke-width="3"/>
    <circle cx="110" cy="270" r="11" fill="#0f172a" stroke="#00ff88" stroke-width="3"/>
    <circle cx="170" cy="360" r="6" fill="#00ff88" filter="url(#spiderGlow)"/>

    <!-- Front Right Leg (Leg 2) -->
    <path d="M 420 200 L 490 270 L 430 360" fill="none" stroke="#475569" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 420 200 L 490 270 L 430 360" fill="none" stroke="#00ff88" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#spiderGlow)"/>
    <!-- Coxa & Femur Joints -->
    <circle cx="420" cy="200" r="12" fill="#0f172a" stroke="#00f2fe" stroke-width="3"/>
    <circle cx="490" cy="270" r="11" fill="#0f172a" stroke="#00ff88" stroke-width="3"/>
    <circle cx="430" cy="360" r="6" fill="#00ff88" filter="url(#spiderGlow)"/>

    <!-- Ultrasonic Sensor Head unit (HC-SR04 Eyes) -->
    <g transform="translate(260, 95)">
      <rect width="80" height="35" rx="6" fill="#1e293b" stroke="#00f2fe" stroke-width="2"/>
      <circle cx="22" cy="17" r="11" fill="#0f172a" stroke="#00f2fe" stroke-width="2"/>
      <circle cx="22" cy="17" r="5" fill="#00f2fe" filter="url(#spiderGlow)"/>
      <circle cx="58" cy="17" r="11" fill="#0f172a" stroke="#00f2fe" stroke-width="2"/>
      <circle cx="58" cy="17" r="5" fill="#00f2fe" filter="url(#spiderGlow)"/>
      <!-- Ultrasonic Waves -->
      <path d="M 30 2 Q 40 -10 50 2" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.7"/>
      <path d="M 25 -5 Q 40 -20 55 -5" fill="none" stroke="#00ff88" stroke-width="2" opacity="0.4"/>
    </g>
  </g>

  <!-- Spec Labels & Telemetry Overlays -->
  <rect x="30" y="30" width="310" height="40" rx="20" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1"/>
  <text x="50" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#00f2fe">🕷️ Робот-павук 12-DOF (ESP32)</text>

  <rect x="560" y="30" width="210" height="70" rx="10" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 255, 136, 0.3)" stroke-width="1"/>
  <text x="575" y="52" font-family="monospace" font-size="11" fill="#00ff88">Gait: Tripod Trot</text>
  <text x="575" y="68" font-family="monospace" font-size="11" fill="#00f2fe">Servo Driver: PCA9685</text>
  <text x="575" y="84" font-family="monospace" font-size="11" fill="#ff9900">IK Kinematics: ACTIVE</text>
</svg>
