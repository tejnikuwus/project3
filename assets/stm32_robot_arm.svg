<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#151d30"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <linearGradient id="metalArm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)"/>

  <!-- Tech Grid Background -->
  <g stroke="rgba(79, 172, 254, 0.06)" stroke-width="1">
    <path d="M 0 60 H 800 M 0 120 H 800 M 0 180 H 800 M 0 240 H 800 M 0 300 H 800 M 0 360 H 800 M 0 420 H 800"/>
    <path d="M 100 0 V 450 M 200 0 V 450 M 300 0 V 450 M 400 0 V 450 M 500 0 V 450 M 600 0 V 450 M 700 0 V 450"/>
  </g>

  <!-- 4-Axis Mechatronic Robot Arm Graphic -->
  <g transform="translate(260, 60)">
    <!-- Base Mounting Plate -->
    <ellipse cx="140" cy="320" rx="110" ry="25" fill="#1e293b" stroke="#00f2fe" stroke-width="2"/>
    <rect x="90" y="270" width="100" height="50" fill="url(#metalArm)" stroke="#475569" stroke-width="2"/>
    <!-- Joint 1 Servo (Base Rotating) -->
    <circle cx="140" cy="270" r="24" fill="#0f172a" stroke="#00f2fe" stroke-width="3" filter="url(#glow2)"/>

    <!-- Link 1 (Shoulder) -->
    <path d="M 140 270 L 80 150" stroke="url(#metalArm)" stroke-width="28" stroke-linecap="round"/>
    <path d="M 140 270 L 80 150" stroke="#00f2fe" stroke-width="4" stroke-dasharray="8,4" filter="url(#glow2)"/>
    <!-- Joint 2 Servo (Elbow) -->
    <circle cx="80" cy="150" r="20" fill="#0f172a" stroke="#00ff88" stroke-width="3" filter="url(#glow2)"/>

    <!-- Link 2 (Forearm) -->
    <path d="M 80 150 L 220 100" stroke="url(#metalArm)" stroke-width="20" stroke-linecap="round"/>
    <path d="M 80 150 L 220 100" stroke="#00ff88" stroke-width="3" stroke-dasharray="6,3"/>
    <!-- Joint 3 Servo (Wrist) -->
    <circle cx="220" cy="100" r="16" fill="#0f172a" stroke="#00f2fe" stroke-width="2"/>

    <!-- End Effector Gripper Claw -->
    <path d="M 220 100 L 260 80 M 260 80 L 280 60 M 260 80 L 280 95" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" filter="url(#glow2)"/>
    <circle cx="280" cy="77" r="8" fill="#00ff88" filter="url(#glow2)"/>
  </g>

  <!-- STM32 Board Controller Node overlay -->
  <g transform="translate(40, 240)">
    <rect width="200" height="150" rx="12" fill="#0b1329" stroke="#4facfe" stroke-width="2" filter="url(#glow2)"/>
    <rect x="60" y="30" width="80" height="80" rx="4" fill="#1e293b" stroke="#00f2fe" stroke-width="1.5"/>
    <text x="100" y="65" font-family="monospace" font-size="12" font-weight="bold" fill="#00f2fe" text-anchor="middle">STM32F4</text>
    <text x="100" y="85" font-family="monospace" font-size="9" fill="#94a3b8" text-anchor="middle">ARM Cortex-M4</text>
    <text x="20" y="130" font-family="monospace" font-size="10" fill="#00ff88">PWM Servo Timers: ON</text>
  </g>

  <!-- Title Badge Overlay -->
  <rect x="30" y="30" width="310" height="40" rx="20" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1"/>
  <text x="50" y="55" font-family="sans-serif" font-size="14" font-weight="bold" fill="#00f2fe">🤖 Робот-маніпулятор STM32</text>
</svg>
